{% extends "base.html" %}
{% block title %}Error {{ code }} — {{ clinic_name }}{% endblock %}
{% block content %}
<div class="card" style="text-align:center; padding:50px 20px;">
  <h2>{{ code }}</h2>
  <p class="muted">{{ message }}</p>
  <a href="{{ url_for('dashboard.home') if current_user else url_for('auth.login') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
